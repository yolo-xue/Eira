<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eira 视频转 GIF</title>
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
  <style>
    /* 核心视觉风格：极简黑白、方正硬朗、无圆角、零蓝色光效 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important;
      outline: none !important;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      padding: 40px 20px;
      max-width: 800px;
      margin: 0 auto;
      line-height: 1.6;
    }

    header {
      border-bottom: 2px solid #000000;
      padding-bottom: 16px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .sub-title {
      font-size: 11px;
      color: #666666;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    /* 说明按钮与小尺寸弹窗 */
    .help-btn {
      background: #ffffff;
      color: #000000;
      border: 1px solid #000000;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .help-btn:hover {
      background: #000000;
      color: #ffffff;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-box {
      background: #ffffff;
      border: 2px solid #000000;
      padding: 18px 20px;
      width: 85%;
      max-width: 340px; /* 缩小了宽度 */
      box-shadow: 6px 6px 0px #000000;
    }

    .modal-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
      border-bottom: 1px solid #000000;
      padding-bottom: 6px;
      letter-spacing: 1px;
    }

    .modal-content {
      font-size: 11px;
      line-height: 1.7;
      color: #333333;
      margin-bottom: 16px;
    }

    .modal-content p {
      margin-bottom: 6px;
    }

    .modal-close-btn {
      width: 100%;
      background: #000000;
      color: #ffffff;
      border: 1px solid #000000;
      padding: 6px 0;
      font-size: 11px;
      cursor: pointer;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .modal-close-btn:hover {
      background: #333333;
    }

    /* 压缩设置面板 */
    .config-panel {
      border: 1px solid #000000;
      padding: 16px;
      margin-bottom: 24px;
      background: #ffffff;
    }

    .config-title {
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .config-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .config-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .config-group label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .config-select {
      border: 1px solid #000000;
      padding: 4px 8px;
      font-size: 11px;
      background: #ffffff;
      color: #000000;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }
    
    .config-select:focus {
      background: #f9f9f9;
    }

    /* 上传区域 */
    .upload-area {
      border: 1px dashed #000000;
      padding: 40px 20px;
      text-align: center;
      background: #ffffff;
      cursor: pointer;
      margin-bottom: 24px;
    }

    .upload-area:hover, .upload-area:active {
      background-color: #f5f5f5;
    }

    .upload-label {
      font-size: 12px;
      letter-spacing: 1px;
      font-weight: 600;
      cursor: pointer;
      display: block;
    }

    #videoInput {
      display: none;
    }

    /* 处理与预览区域 */
    .process-section {
      text-align: center;
      margin-bottom: 24px;
      display: none;
    }

    .status-text {
      font-size: 12px;
      letter-spacing: 1px;
      color: #000000;
      margin-bottom: 16px;
      font-weight: 600;
    }

    .preview-box {
      border: 1px solid #000000;
      padding: 10px;
      background: #fafafa;
      background-image: linear-gradient(45deg, #eee 25%, transparent 25%),
                        linear-gradient(-45deg, #eee 25%, transparent 25%),
                        linear-gradient(45deg, transparent 75%, #eee 75%),
                        linear-gradient(-45deg, transparent 75%, #eee 75%);
      background-size: 12px 12px;
      background-position: 0 0, 0 6px, 6px -6px, -6px 0px;
      margin-bottom: 16px;
      max-width: 100%;
      display: inline-block;
    }

    .preview-box img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* 按钮样式 */
    .btn {
      background: #000000;
      color: #ffffff;
      border: 1px solid #000000;
      padding: 10px 20px;
      font-size: 11px;
      letter-spacing: 1px;
      cursor: pointer;
      font-weight: 600;
      display: inline-block;
      text-decoration: none;
    }

    .btn:hover, .btn:active {
      background: #333333;
      border-color: #333333;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>视频转 GIF 动图</h1>
      <div class="sub-title">Eira 工具箱</div>
    </div>
    <button class="help-btn" id="openHelpBtn">使用说明</button>
  </header>

  <!-- 精简小尺寸使用说明弹窗 -->
  <div class="modal-overlay" id="helpModal">
    <div class="modal-box">
      <div class="modal-title">使用说明与须知</div>
      <div class="modal-content">
        <p><strong>文件限制：</strong>MP4 格式，限制 <strong>30MB / 2分钟以内</strong>。</p>
        <p><strong>本地加密：</strong>视频全部在手机/电脑本地运算转换，零泄露风险。</p>
        <p><strong>档位说明：</strong></p>
        <p>低压缩：保留较多细节，体积稍大。</p>
        <p>中压缩 (推荐)：平衡画质与体积。</p>
        <p>高压缩：极大缩减体积，方便传输。</p>
      </div>
      <button class="modal-close-btn" id="closeHelpBtn">关闭</button>
    </div>
  </div>

  <!-- 压缩设置面板 -->
  <div class="config-panel">
    <div class="config-title">GIF 压缩档位设置</div>
    <div class="config-row">
      <div class="config-group">
        <label for="qualitySelect">体积压缩程度:</label>
        <select id="qualitySelect" class="config-select">
          <option value="high_compress">高压缩 (约缩小 80% 体积, 画质较低但极小)</option>
          <option value="medium_compress" selected>中等压缩 (约缩小 65% 体积, 平衡推荐)</option>
          <option value="low_compress">低压缩 (约缩小 40% 体积, 较清晰)</option>
          <option value="no_compress">原画质导出 (几乎不压缩, 体积极其庞大)</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 上传区域 -->
  <div class="upload-area" id="dropZone">
    <label class="upload-label" for="videoInput">点击选择视频或拖拽 MP4 至此处 (最大 30MB / 2分钟)</label>
    <input type="file" id="videoInput" accept="video/mp4,video/*" />
  </div>

  <!-- 状态显示与预览下载 -->
  <div class="process-section" id="processSection">
    <div class="status-text" id="statusText">正在准备核心组件...</div>
    <div id="previewContainer" style="display: none;">
      <div class="preview-box">
        <img id="gifPreview" src="" alt="GIF 预览" />
      </div>
      <div>
        <a href="" id="downloadBtn" class="btn" download="eira_export.gif">下载 GIF</a>
        <button class="btn" id="restartBtn" style="margin-left: 10px; background:#ffffff; color:#000000;">重新上传</button>
      </div>
    </div>
  </div>

  <script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    let ffmpeg = null;
    let isFFmpegLoaded = false;

    const videoInput = document.getElementById('videoInput');
    const dropZone = document.getElementById('dropZone');
    const processSection = document.getElementById('processSection');
    const statusText = document.getElementById('statusText');
    const previewContainer = document.getElementById('previewContainer');
    const gifPreview = document.getElementById('gifPreview');
    const downloadBtn = document.getElementById('downloadBtn');
    const restartBtn = document.getElementById('restartBtn');
    const qualitySelect = document.getElementById('qualitySelect');

    const helpModal = document.getElementById('helpModal');
    document.getElementById('openHelpBtn').onclick = () => helpModal.style.display = 'flex';
    document.getElementById('closeHelpBtn').onclick = () => helpModal.style.display = 'none';
    helpModal.onclick = (e) => { if(e.target === helpModal) helpModal.style.display = 'none'; };

    // 强行指定稳定源强制加载 WebAssembly 内核
    async function forceInitFFmpeg() {
      if (isFFmpegLoaded && ffmpeg) return true;
      try {
        ffmpeg = createFFmpeg({
          log: true,
          corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js'
        });

        ffmpeg.setProgress(({ ratio }) => {
          if (ratio >= 0 && ratio <= 1) {
            statusText.innerText = `正在转码处理中: ${Math.round(ratio * 100)}%`;
          }
        });

        statusText.innerText = '正在从稳定节点装载解码引擎 (首次约需5-15秒)...';
        await ffmpeg.load();
        isFFmpegLoaded = true;
        return true;
      } catch (e) {
        console.error("FFmpeg 强制装载失败:", e);
        return false;
      }
    }

    dropZone.addEventListener('click', () => videoInput.click());

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.style.backgroundColor = '#eeeeee';
    });
    dropZone.addEventListener('dragleave', () => {
      dropZone.style.backgroundColor = '#ffffff';
    });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.style.backgroundColor = '#ffffff';
      if (e.dataTransfer.files.length) {
        handleVideo(e.dataTransfer.files[0]);
      }
    });

    videoInput.addEventListener('change', (e) => {
      if (e.target.files.length) {
        handleVideo(e.target.files[0]);
      }
    });

    restartBtn.onclick = () => {
      location.reload();
    };

    async function handleVideo(file) {
      if (file.size > 30 * 1024 * 1024) {
        alert(`视频文件 (${(file.size / (1024 * 1024)).toFixed(1)}MB) 超过限制，最大支持 30MB！`);
        return;
      }

      const videoCheck = document.createElement('video');
      videoCheck.preload = 'metadata';
      videoCheck.onloadedmetadata = function() {
        window.URL.revokeObjectURL(videoCheck.src);
        if (videoCheck.duration > 120) {
          alert(`视频时长为 ${Math.round(videoCheck.duration)} 秒，超过了 2 分钟限制！`);
          return;
        }
        startConversion(file);
      };
      videoCheck.onerror = function() {
        startConversion(file);
      };
      videoCheck.src = URL.createObjectURL(file);
    }

    async function startConversion(file) {
      dropZone.style.display = 'none';
      processSection.style.display = 'block';
      previewContainer.style.display = 'none';

      const loaded = await forceInitFFmpeg();
      if (!loaded) {
        statusText.innerText = '引擎网络连接阻断，请尝试刷新页面重试。';
        restartBtn.style.display = 'inline-block';
        return;
      }

      try {
        statusText.innerText = '正在载入视频数据...';
        const inputName = 'input_file.mp4';
        ffmpeg.FS('writeFile', inputName, await fetchFile(file));

        statusText.innerText = '准备生成 GIF 动图...';

        const quality = qualitySelect.value;
        let scale, fps;
        
        switch(quality) {
          case 'high_compress':   scale = 320; fps = 8; break;
          case 'medium_compress': scale = 480; fps = 12; break;
          case 'low_compress':    scale = 640; fps = 15; break;
          case 'no_compress':     scale = 720; fps = 20; break;
          default:                scale = 480; fps = 12;
        }

        await ffmpeg.run(
          '-i', inputName,
          '-vf', `fps=${fps},scale=${scale}:-1:flags=lanczos`,
          'output.gif'
        );

        statusText.innerText = '生成完毕，正在渲染预览...';

        const data = ffmpeg.FS('readFile', 'output.gif');
        const gifBlob = new Blob([data.buffer], { type: 'image/gif' });
        const url = URL.createObjectURL(gifBlob);

        gifPreview.src = url;
        downloadBtn.href = url;
        downloadBtn.download = `eira_export.gif`;

        previewContainer.style.display = 'block';
        statusText.innerText = `转换成功！`;

        try {
          ffmpeg.FS('unlink', inputName);
          ffmpeg.FS('unlink', 'output.gif');
        } catch(e) {}

      } catch (error) {
        console.error(error);
        statusText.innerText = '转换异常：建议更换极短视频或标准 MP4 格式重试。';
        restartBtn.style.display = 'inline-block';
      }
    }
  </script>
</body>
</html>
