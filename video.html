<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eira 视频转 GIF</title>
  <script src="https://cdn.jsdelivr.net/npm/omggif@1.0.10/omggif.min.js"></script>
  <style>
    /* 核心视觉风格：极简黑白、方正硬朗、无圆角 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important;
      outline: none !important;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      padding: 40px 20px;
      max-width: 800px;
      margin: 0 auto;
      line-height: 1.6;
    }

    header {
      border-bottom: 2px solid #000000;
      padding-bottom: 16px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .sub-title {
      font-size: 11px;
      color: #666666;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    .help-btn {
      background: #ffffff;
      color: #000000;
      border: 1px solid #000000;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .help-btn:hover {
      background: #000000;
      color: #ffffff;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-box {
      background: #ffffff;
      border: 2px solid #000000;
      padding: 18px 20px;
      width: 85%;
      max-width: 340px;
      box-shadow: 6px 6px 0px #000000;
    }

    .modal-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
      border-bottom: 1px solid #000000;
      padding-bottom: 6px;
      letter-spacing: 1px;
    }

    .modal-content {
      font-size: 11px;
      line-height: 1.7;
      color: #333333;
      margin-bottom: 16px;
    }

    .modal-close-btn {
      width: 100%;
      background: #000000;
      color: #ffffff;
      border: 1px solid #000000;
      padding: 6px 0;
      font-size: 11px;
      cursor: pointer;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .config-panel {
      border: 1px solid #000000;
      padding: 16px 20px;
      margin-bottom: 24px;
      background: #ffffff;
    }

    .config-title {
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .select-wrapper {
      position: relative;
      width: 100%;
    }

    .select-wrapper::after {
      content: "▼";
      font-size: 9px;
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: #000000;
    }

    .config-select {
      width: 100%;
      border: 1px solid #000000;
      padding: 8px 30px 8px 12px;
      font-size: 11px;
      background: #ffffff;
      color: #000000;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      font-weight: 500;
    }

    .upload-area {
      border: 1px dashed #000000;
      padding: 40px 20px;
      text-align: center;
      background: #ffffff;
      cursor: pointer;
      margin-bottom: 24px;
    }

    .upload-area:hover {
      background-color: #f5f5f5;
    }

    .upload-label {
      font-size: 12px;
      letter-spacing: 1px;
      font-weight: 600;
      cursor: pointer;
      display: block;
    }

    #videoInput {
      display: none;
    }

    .process-section {
      text-align: center;
      margin-bottom: 24px;
      display: none;
    }

    .status-text {
      font-size: 12px;
      letter-spacing: 1px;
      color: #000000;
      margin-bottom: 16px;
      font-weight: 600;
    }

    .preview-box {
      border: 1px solid #000000;
      padding: 10px;
      background: #fafafa;
      margin-bottom: 16px;
      max-width: 100%;
      display: inline-block;
    }

    .preview-box img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .btn {
      background: #000000;
      color: #ffffff;
      border: 1px solid #000000;
      padding: 10px 20px;
      font-size: 11px;
      letter-spacing: 1px;
      cursor: pointer;
      font-weight: 600;
      display: inline-block;
      text-decoration: none;
    }

    .btn-secondary {
      background: #ffffff;
      color: #000000;
    }

    .btn-secondary:hover {
      background: #f0f0f0;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>视频转动图</h1>
      <div class="sub-title">Eira 工具箱</div>
    </div>
    <button class="help-btn" id="openHelpBtn">使用说明</button>
  </header>

  <div class="modal-overlay" id="helpModal">
    <div class="modal-box">
      <div class="modal-title">使用说明与须知</div>
      <div class="modal-content">
        <p><strong>转换机制：</strong>本地直接编码合成真实 `.gif` 文件。</p>
        <p><strong>时长限制：</strong>限制在 <strong>1 分钟以内</strong> 的 MP4 视频。</p>
      </div>
      <button class="modal-close-btn" id="closeHelpBtn">关闭</button>
    </div>
  </div>

  <div class="config-panel">
    <div class="config-title">转换模式设置</div>
    <div class="config-row">
      <div class="select-wrapper">
        <select id="qualitySelect" class="config-select">
          <option value="raw" selected>高清模式 (较高清晰度，体积稍大)</option>
          <option value="medium">中等模式 (尺寸适中，平衡压缩)</option>
          <option value="low">高压缩模式 (缩小尺寸，生成极快)</option>
        </select>
      </div>
    </div>
  </div>

  <div class="upload-area" id="dropZone">
    <label class="upload-label" for="videoInput">点击选择视频或拖拽 MP4 至此处 (限制 1 分钟以内)</label>
    <input type="file" id="videoInput" accept="video/mp4,video/*" />
  </div>

  <div class="process-section" id="processSection">
    <div class="status-text" id="statusText">正在准备处理...</div>
    
    <div id="previewContainer" style="display: none;">
      <div class="preview-box">
        <img id="gifResultImg" src="" alt="生成的 GIF" />
      </div>
      <div class="btn-group">
        <a id="downloadBtn" href="#" download="eira_export.gif" class="btn">下载 GIF</a>
        <button class="btn btn-secondary" id="restartBtn">删除并重新上传</button>
      </div>
    </div>
  </div>

  <video id="hiddenVideo" style="display:none;" playsinline muted></video>
  <canvas id="workCanvas" style="display:none;"></canvas>

  <script>
    const videoInput = document.getElementById('videoInput');
    const dropZone = document.getElementById('dropZone');
    const processSection = document.getElementById('processSection');
    const statusText = document.getElementById('statusText');
    const previewContainer = document.getElementById('previewContainer');
    const restartBtn = document.getElementById('restartBtn');
    const hiddenVideo = document.getElementById('hiddenVideo');
    const workCanvas = document.getElementById('workCanvas');
    const ctx = workCanvas.getContext('2d');
    const gifResultImg = document.getElementById('gifResultImg');
    const downloadBtn = document.getElementById('downloadBtn');
    const qualitySelect = document.getElementById('qualitySelect');

    let createdObjectUrl = null;

    const helpModal = document.getElementById('helpModal');
    document.getElementById('openHelpBtn').onclick = () => helpModal.style.display = 'flex';
    document.getElementById('closeHelpBtn').onclick = () => helpModal.style.display = 'none';
    helpModal.onclick = (e) => { if(e.target === helpModal) helpModal.style.display = 'none'; };

    dropZone.onclick = () => videoInput.click();
    videoInput.onchange = (e) => { if (e.target.files.length) handleVideo(e.target.files[0]); };

    restartBtn.onclick = resetUI;

    function resetUI() {
      if (createdObjectUrl) {
        URL.revokeObjectURL(createdObjectUrl);
        createdObjectUrl = null;
      }
      dropZone.style.display = 'block';
      processSection.style.display = 'none';
      previewContainer.style.display = 'none';
      hiddenVideo.pause();
      hiddenVideo.src = '';
      videoInput.value = '';
    }

    function handleVideo(file) {
      dropZone.style.display = 'none';
      processSection.style.display = 'block';
      previewContainer.style.display = 'none';
      statusText.innerText = '正在读取本地视频...';

      const fileURL = URL.createObjectURL(file);
      hiddenVideo.src = fileURL;

      hiddenVideo.onloadedmetadata = () => {
        if (hiddenVideo.duration > 60) {
          alert(`视频时长超过 1 分钟（实际 ${Math.round(hiddenVideo.duration)} 秒），请重新选择较短视频！`);
          resetUI();
          return;
        }
        startGifEncoding();
      };

      hiddenVideo.onerror = () => {
        statusText.innerText = '视频解析失败，请确保格式为标准 MP4！';
      };
    }

    async function startGifEncoding() {
      statusText.innerText = '正在提取视频帧...';
      
      const mode = qualitySelect.value;
      let targetWidth = hiddenVideo.videoWidth || 480;
      let targetHeight = hiddenVideo.videoHeight || 320;
      let fps = 10;

      if (mode === 'medium') {
        targetWidth = Math.min(targetWidth, 400);
        targetHeight = Math.round((targetWidth / hiddenVideo.videoWidth) * hiddenVideo.videoHeight);
        fps = 8;
      } else if (mode === 'low') {
        targetWidth = Math.min(targetWidth, 280);
        targetHeight = Math.round((targetWidth / hiddenVideo.videoWidth) * hiddenVideo.videoHeight);
        fps = 6;
      }

      workCanvas.width = targetWidth;
      workCanvas.height = targetHeight;

      const duration = hiddenVideo.duration;
      const totalFrames = Math.floor(duration * fps);
      const frameInterval = 1 / fps;

      // 提取所有帧的数据
      const frames = [];
      for (let i = 0; i < totalFrames; i++) {
        hiddenVideo.currentTime = i * frameInterval;
        await new Promise(resolve => {
          hiddenVideo.onseeked = resolve;
        });

        ctx.drawImage(hiddenVideo, 0, 0, targetWidth, targetHeight);
        const imgData = ctx.getImageData(0, 0, targetWidth, targetHeight);
        frames.push(imgData);

        const progress = Math.round(((i + 1) / totalFrames) * 50);
        statusText.innerText = `正在捕获视频画面: ${progress}%`;
      }

      statusText.innerText = '正在合成 GIF 动图...';

      // 简易 GIF 打包逻辑
      try {
        const buffer = new Uint8Array(targetWidth * targetHeight * totalFrames * 5 + 1024);
        const gifWriter = new omggif.GifWriter(buffer, targetWidth, targetHeight, { loop: 0 });

        for (let i = 0; i < frames.length; i++) {
          const rgba = frames[i].data;
          const palette = [];
          const indexedPixels = new Uint8Array(targetWidth * targetHeight);

          // 简略调色板提取与索引
          for (let p = 0; p < rgba.length; p += 4) {
            const r = rgba[p] & 0xE0;
            const g = rgba[p + 1] & 0xE0;
            const b = rgba[p + 2] & 0xC0;
            const color = (r << 16) | (g << 8) | b;
            
            let colorIdx = palette.indexOf(color);
            if (colorIdx === -1) {
              if (palette.length < 256) {
                palette.push(color);
                colorIdx = palette.length - 1;
              } else {
                colorIdx = 0;
              }
            }
            indexedPixels[p / 4] = colorIdx;
          }

          // 补齐 256 色
          while (palette.length < 256) palette.push(0);

          gifWriter.addFrame(0, 0, targetWidth, targetHeight, indexedPixels, {
            palette: palette,
            delay: Math.round(100 / fps)
          });

          const encodeProgress = 50 + Math.round(((i + 1) / totalFrames) * 50);
          statusText.innerText = `正在打包 GIF: ${encodeProgress}%`;
        }

        const gifData = buffer.subarray(0, gifWriter.end());
        const blob = new Blob([gifData], { type: 'image/gif' });
        
        createdObjectUrl = URL.createObjectURL(blob);
        gifResultImg.src = createdObjectUrl;
        downloadBtn.href = createdObjectUrl;

        statusText.innerText = '转换完成！可以下载或删除重来。';
        previewContainer.style.display = 'block';

      } catch (err) {
        console.error(err);
        statusText.innerText = 'GIF 合成失败，建议选择中等/低模式重试。';
      }
    }
  </script>
</body>
</html>
