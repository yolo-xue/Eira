<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eira 视频转 GIF</title>
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
  <style>
    /* 核心视觉风格：极简黑白、方正硬朗、无圆角、零蓝色光效 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important;
      outline: none !important;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      padding: 40px 20px;
      max-width: 800px;
      margin: 0 auto;
      line-height: 1.6;
    }

    header {
      border-bottom: 2px solid #000000;
      padding-bottom: 16px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .sub-title {
      font-size: 11px;
      color: #666666;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    /* 说明按钮与弹窗 */
    .help-btn {
      background: #ffffff;
      color: #000000;
      border: 1px solid #000000;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .help-btn:hover {
      background: #000000;
      color: #ffffff;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-box {
      background: #ffffff;
      border: 2px solid #000000;
      padding: 18px 20px;
      width: 85%;
      max-width: 340px;
      box-shadow: 6px 6px 0px #000000;
    }

    .modal-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
      border-bottom: 1px solid #000000;
      padding-bottom: 6px;
      letter-spacing: 1px;
    }

    .modal-content {
      font-size: 11px;
      line-height: 1.7;
      color: #333333;
      margin-bottom: 16px;
    }

    .modal-content p {
      margin-bottom: 6px;
    }

    .modal-close-btn {
      width: 100%;
      background: #000000;
      color: #ffffff;
      border: 1px solid #000000;
      padding: 6px 0;
      font-size: 11px;
      cursor: pointer;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .modal-close-btn:hover {
      background: #333333;
    }

    /* 优化后的极简黑色美化设置面板 */
    .config-panel {
      border: 1px solid #000000;
      padding: 16px 20px;
      margin-bottom: 24px;
      background: #ffffff;
    }

    .config-title {
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .config-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .config-group label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      display: block;
      margin-bottom: 6px;
      color: #333333;
    }

    /* 自定义美化下拉框 */
    .select-wrapper {
      position: relative;
      width: 100%;
    }

    .select-wrapper::after {
      content: "▼";
      font-size: 9px;
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: #000000;
    }

    .config-select {
      width: 100%;
      border: 1px solid #000000;
      padding: 8px 30px 8px 12px;
      font-size: 11px;
      background: #ffffff;
      color: #000000;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      font-weight: 500;
      letter-spacing: 0.5px;
      transition: background 0.2s;
    }

    .config-select:hover, .config-select:focus {
      background: #f5f5f5;
    }

    /* 上传区域 */
    .upload-area {
      border: 1px dashed #000000;
      padding: 40px 20px;
      text-align: center;
      background: #ffffff;
      cursor: pointer;
      margin-bottom: 24px;
    }

    .upload-area:hover, .upload-area:active {
      background-color: #f5f5f5;
    }

    .upload-label {
      font-size: 12px;
      letter-spacing: 1px;
      font-weight: 600;
      cursor: pointer;
      display: block;
    }

    #videoInput {
      display: none;
    }

    /* 处理与预览区域 */
    .process-section {
      text-align: center;
      margin-bottom: 24px;
      display: none;
    }

    .status-text {
      font-size: 12px;
      letter-spacing: 1px;
      color: #000000;
      margin-bottom: 16px;
      font-weight: 600;
    }

    .preview-box {
      border: 1px solid #000000;
      padding: 10px;
      background: #fafafa;
      background-image: linear-gradient(45deg, #eee 25%, transparent 25%),
                        linear-gradient(-45deg, #eee 25%, transparent 25%),
                        linear-gradient(45deg, transparent 75%, #eee 75%),
                        linear-gradient(-45deg, transparent 75%, #eee 75%);
      background-size: 12px 12px;
      background-position: 0 0, 0 6px, 6px -6px, -6px 0px;
      margin-bottom: 16px;
      max-width: 100%;
      display: inline-block;
    }

    .preview-box img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* 按钮样式 */
    .btn {
      background: #000000;
      color: #ffffff;
      border: 1px solid #000000;
      padding: 10px 20px;
      font-size: 11px;
      letter-spacing: 1px;
      cursor: pointer;
      font-weight: 600;
      display: inline-block;
      text-decoration: none;
    }

    .btn:hover, .btn:active {
      background: #333333;
      border-color: #333333;
    }

    .btn-secondary {
      background: #ffffff;
      color: #000000;
      margin-left: 10px;
    }

    .btn-secondary:hover {
      background: #f0f0f0;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>视频转 GIF 动图</h1>
      <div class="sub-title">Eira 工具箱</div>
    </div>
    <button class="help-btn" id="openHelpBtn">使用说明</button>
  </header>

  <div class="modal-overlay" id="helpModal">
    <div class="modal-box">
      <div class="modal-title">使用说明与须知</div>
      <div class="modal-content">
        <p><strong>文件限制：</strong>仅限 MP4 格式，文件上限 <strong>60MB 以内</strong>。</p>
        <p><strong>无时长限制：</strong>不限制视频时长，短视频转换更迅速。</p>
        <p><strong>本地处理：</strong>所有运算均在浏览器本地完成，保护隐私。</p>
        <p><strong>转换模式：</strong></p>
        <p>不压缩：只转 GIF，完全保留原画质与分辨率。</p>
        <p>压缩模式：可根据需求有效减小导出文件体积。</p>
      </div>
      <button class="modal-close-btn" id="closeHelpBtn">关闭</button>
    </div>
  </div>

  <div class="config-panel">
    <div class="config-title">转换与压缩选项</div>
    <div class="config-row">
      <div class="config-group">
        <label for="qualitySelect">选择转换模式:</label>
        <div class="select-wrapper">
          <select id="qualitySelect" class="config-select">
            <option value="raw" selected>不压缩 (只转 GIF, 保持原画质与原始分辨率)</option>
            <option value="medium_compress">中等压缩 (推荐, 约缩小 65% 体积)</option>
            <option value="high_compress">高压缩 (极限压缩体积, 方便传输)</option>
            <option value="low_compress">低压缩 (轻微压缩, 保持较清晰度)</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="upload-area" id="dropZone">
    <label class="upload-label" for="videoInput">点击选择视频或拖拽 MP4 至此处 (最大 60MB)</label>
    <input type="file" id="videoInput" accept="video/mp4,video/*" />
  </div>

  <div class="process-section" id="processSection">
    <div class="status-text" id="statusText">正在准备核心组件...</div>
    
    <div id="errorControl" style="display: none; margin-top: 15px;">
      <button class="btn btn-secondary" id="resetBtn">重置并重新上传</button>
    </div>

    <div id="previewContainer" style="display: none;">
      <div class="preview-box">
        <img id="gifPreview" src="" alt="GIF 预览" />
      </div>
      <div>
        <a href="" id="downloadBtn" class="btn" download="eira_export.gif">下载 GIF</a>
        <button class="btn btn-secondary" id="restartBtn">重新上传</button>
      </div>
    </div>
  </div>

  <script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    let ffmpeg = null;
    let isFFmpegLoaded = false;

    const videoInput = document.getElementById('videoInput');
    const dropZone = document.getElementById('dropZone');
    const processSection = document.getElementById('processSection');
    const statusText = document.getElementById('statusText');
    const previewContainer = document.getElementById('previewContainer');
    const gifPreview = document.getElementById('gifPreview');
    const downloadBtn = document.getElementById('downloadBtn');
    const restartBtn = document.getElementById('restartBtn');
    const resetBtn = document.getElementById('resetBtn');
    const errorControl = document.getElementById('errorControl');
    const qualitySelect = document.getElementById('qualitySelect');

    const helpModal = document.getElementById('helpModal');
    document.getElementById('openHelpBtn').onclick = () => helpModal.style.display = 'flex';
    document.getElementById('closeHelpBtn').onclick = () => helpModal.style.display = 'none';
    helpModal.onclick = (e) => { if(e.target === helpModal) helpModal.style.display = 'none'; };

    async function forceInitFFmpeg() {
      if (isFFmpegLoaded && ffmpeg) return true;
      try {
        ffmpeg = createFFmpeg({
          log: true,
          corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js'
        });

        ffmpeg.setProgress(({ ratio }) => {
          if (ratio >= 0 && ratio <= 1) {
            statusText.innerText = `正在转码处理中: ${Math.round(ratio * 100)}%`;
          }
        });

        statusText.innerText = '正在装载解码引擎...';
        await ffmpeg.load();
        isFFmpegLoaded = true;
        return true;
      } catch (e) {
        console.error("FFmpeg 装载失败:", e);
        return false;
      }
    }

    dropZone.addEventListener('click', () => videoInput.click());

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.style.backgroundColor = '#eeeeee';
    });
    dropZone.addEventListener('dragleave', () => {
      dropZone.style.backgroundColor = '#ffffff';
    });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.style.backgroundColor = '#ffffff';
      if (e.dataTransfer.files.length) {
        handleVideo(e.dataTransfer.files[0]);
      }
    });

    videoInput.addEventListener('change', (e) => {
      if (e.target.files.length) {
        handleVideo(e.target.files[0]);
      }
    });

    function resetUI() {
      dropZone.style.display = 'block';
      processSection.style.display = 'none';
      previewContainer.style.display = 'none';
      errorControl.style.display = 'none';
      videoInput.value = '';
    }

    restartBtn.onclick = resetUI;
    resetBtn.onclick = resetUI;

    async function handleVideo(file) {
      // 提升上限至 60MB
      if (file.size > 60 * 1024 * 1024) {
        alert(`视频文件 (${(file.size / (1024 * 1024)).toFixed(1)}MB) 超过限制，最大支持 60MB！`);
        return;
      }

      startConversion(file);
    }

    async function startConversion(file) {
      dropZone.style.display = 'none';
      processSection.style.display = 'block';
      previewContainer.style.display = 'none';
      errorControl.style.display = 'none';

      const loaded = await forceInitFFmpeg();
      if (!loaded) {
        statusText.innerText = '引擎网络连接阻断，请重试。';
        errorControl.style.display = 'block';
        return;
      }

      try {
        statusText.innerText = '正在载入视频数据...';
        const inputName = 'input_file.mp4';
        ffmpeg.FS('writeFile', inputName, await fetchFile(file));

        statusText.innerText = '准备生成 GIF 动图...';

        const mode = qualitySelect.value;
        let ffmpegArgs = [];

        if (mode === 'raw') {
          // 不压缩，保持原画质与参数导出
          ffmpegArgs = ['-i', inputName, 'output.gif'];
        } else {
          // 压缩模式设置
          let scale, fps;
          switch(mode) {
            case 'high_compress':   scale = 320; fps = 8; break;
            case 'medium_compress': scale = 480; fps = 12; break;
            case 'low_compress':    scale = 640; fps = 15; break;
            default:                scale = 480; fps = 12;
          }
          ffmpegArgs = [
            '-i', inputName,
            '-vf', `fps=${fps},scale=${scale}:-1:flags=lanczos`,
            'output.gif'
          ];
        }

        await ffmpeg.run(...ffmpegArgs);

        statusText.innerText = '生成完毕，正在渲染预览...';

        const data = ffmpeg.FS('readFile', 'output.gif');
        const gifBlob = new Blob([data.buffer], { type: 'image/gif' });
        const url = URL.createObjectURL(gifBlob);

        gifPreview.src = url;
        downloadBtn.href = url;
        downloadBtn.download = `eira_export.gif`;

        previewContainer.style.display = 'block';
        statusText.innerText = `转换成功！`;

        try {
          ffmpeg.FS('unlink', inputName);
          ffmpeg.FS('unlink', 'output.gif');
        } catch(e) {}

      } catch (error) {
        console.error(error);
        statusText.innerText = '转换失败，格式可能不兼容。';
        errorControl.style.display = 'block';
      }
    }
  </script>
</body>
</html>
