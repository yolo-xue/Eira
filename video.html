<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eira 视频转 GIF</title>
  <script src="https://cdn.jsdelivr.net/npm/gifshot@0.4.5/build/gifshot.min.js"></script>
  <style>
    /* 核心视觉风格：极简黑白、方正硬朗、无圆角 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important;
      outline: none !important;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      padding: 40px 20px;
      max-width: 800px;
      margin: 0 auto;
      line-height: 1.6;
    }

    header {
      border-bottom: 2px solid #000000;
      padding-bottom: 16px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .sub-title {
      font-size: 11px;
      color: #666666;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    .help-btn {
      background: #ffffff;
      color: #000000;
      border: 1px solid #000000;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .help-btn:hover {
      background: #000000;
      color: #ffffff;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-box {
      background: #ffffff;
      border: 2px solid #000000;
      padding: 18px 20px;
      width: 85%;
      max-width: 340px;
      box-shadow: 6px 6px 0px #000000;
    }

    .modal-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
      border-bottom: 1px solid #000000;
      padding-bottom: 6px;
      letter-spacing: 1px;
    }

    .modal-content {
      font-size: 11px;
      line-height: 1.7;
      color: #333333;
      margin-bottom: 16px;
    }

    .modal-close-btn {
      width: 100%;
      background: #000000;
      color: #ffffff;
      border: 1px solid #000000;
      padding: 6px 0;
      font-size: 11px;
      cursor: pointer;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .config-panel {
      border: 1px solid #000000;
      padding: 16px 20px;
      margin-bottom: 24px;
      background: #ffffff;
    }

    .config-title {
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .select-wrapper {
      position: relative;
      width: 100%;
    }

    .select-wrapper::after {
      content: "▼";
      font-size: 9px;
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: #000000;
    }

    .config-select {
      width: 100%;
      border: 1px solid #000000;
      padding: 8px 30px 8px 12px;
      font-size: 11px;
      background: #ffffff;
      color: #000000;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      font-weight: 500;
    }

    .upload-area {
      border: 1px dashed #000000;
      padding: 40px 20px;
      text-align: center;
      background: #ffffff;
      cursor: pointer;
      margin-bottom: 24px;
    }

    .upload-area:hover {
      background-color: #f5f5f5;
    }

    .upload-label {
      font-size: 12px;
      letter-spacing: 1px;
      font-weight: 600;
      cursor: pointer;
      display: block;
    }

    #videoInput {
      display: none;
    }

    .process-section {
      text-align: center;
      margin-bottom: 24px;
      display: none;
    }

    .status-text {
      font-size: 12px;
      letter-spacing: 1px;
      color: #000000;
      margin-bottom: 16px;
      font-weight: 600;
    }

    .preview-box {
      border: 1px solid #000000;
      padding: 10px;
      background: #fafafa;
      margin-bottom: 16px;
      max-width: 100%;
      display: inline-block;
    }

    .preview-box img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .btn {
      background: #000000;
      color: #ffffff;
      border: 1px solid #000000;
      padding: 10px 20px;
      font-size: 11px;
      letter-spacing: 1px;
      cursor: pointer;
      font-weight: 600;
      display: inline-block;
      text-decoration: none;
    }

    .btn:hover {
      background: #333333;
    }

    .btn-secondary {
      background: #ffffff;
      color: #000000;
      margin-left: 10px;
    }

    .btn-secondary:hover {
      background: #f0f0f0;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>视频转动图</h1>
      <div class="sub-title">Eira 工具箱</div>
    </div>
    <button class="help-btn" id="openHelpBtn">使用说明</button>
  </header>

  <div class="modal-overlay" id="helpModal">
    <div class="modal-box">
      <div class="modal-title">使用说明与须知</div>
      <div class="modal-content">
        <p><strong>完全离线：</strong>本地前端渲染生成标准 GIF 文件。</p>
        <p><strong>时长限制：</strong>限制 <strong>1 分钟以内</strong> 的视频。</p>
      </div>
      <button class="modal-close-btn" id="closeHelpBtn">关闭</button>
    </div>
  </div>

  <div class="config-panel">
    <div class="config-title">转换模式设置</div>
    <div class="config-row">
      <div class="select-wrapper">
        <select id="qualitySelect" class="config-select">
          <option value="raw" selected>不压缩 (保持原画质与原始分辨率转 GIF)</option>
          <option value="medium">中等压缩 (适度缩放尺寸，打包更快)</option>
          <option value="low">高压缩模式 (缩小尺寸与降低帧率)</option>
        </select>
      </div>
    </div>
  </div>

  <div class="upload-area" id="dropZone">
    <label class="upload-label" for="videoInput">点击选择视频或拖拽 MP4 至此处 (限制 1 分钟以内)</label>
    <input type="file" id="videoInput" accept="video/mp4,video/*" />
  </div>

  <div class="process-section" id="processSection">
    <div class="status-text" id="statusText">正在准备处理...</div>
    
    <div id="previewContainer" style="display: none;">
      <div class="preview-box">
        <img id="gifPreview" src="" alt="生成的 GIF 动图" />
      </div>
      <div>
        <a href="" id="downloadBtn" class="btn" download="eira_export.gif">下载 GIF</a>
        <button class="btn btn-secondary" id="restartBtn">删除并重新上传</button>
      </div>
    </div>
  </div>

  <script>
    const videoInput = document.getElementById('videoInput');
    const dropZone = document.getElementById('dropZone');
    const processSection = document.getElementById('processSection');
    const statusText = document.getElementById('statusText');
    const previewContainer = document.getElementById('previewContainer');
    const gifPreview = document.getElementById('gifPreview');
    const downloadBtn = document.getElementById('downloadBtn');
    const restartBtn = document.getElementById('restartBtn');
    const qualitySelect = document.getElementById('qualitySelect');

    const helpModal = document.getElementById('helpModal');
    document.getElementById('openHelpBtn').onclick = () => helpModal.style.display = 'flex';
    document.getElementById('closeHelpBtn').onclick = () => helpModal.style.display = 'none';
    helpModal.onclick = (e) => { if(e.target === helpModal) helpModal.style.display = 'none'; };

    dropZone.onclick = () => videoInput.click();
    videoInput.onchange = (e) => { if (e.target.files.length) handleVideo(e.target.files[0]); };

    restartBtn.onclick = () => {
      dropZone.style.display = 'block';
      processSection.style.display = 'none';
      previewContainer.style.display = 'none';
      videoInput.value = '';
    };

    function handleVideo(file) {
      dropZone.style.display = 'none';
      processSection.style.display = 'block';
      previewContainer.style.display = 'none';
      statusText.innerText = '正在校验视频信息...';

      const fileURL = URL.createObjectURL(file);
      const tempVideo = document.createElement('video');
      tempVideo.src = fileURL;
      tempVideo.preload = 'metadata';

      tempVideo.onloadedmetadata = () => {
        if (tempVideo.duration > 60) {
          alert(`视频时长为 ${Math.round(tempVideo.duration)} 秒，超过了 1 分钟限制！`);
          restartBtn.click();
          return;
        }
        generateGif(fileURL, tempVideo.videoWidth, tempVideo.videoHeight, tempVideo.duration);
      };

      tempVideo.onerror = () => {
        statusText.innerText = '视频解析失败，请确保格式为标准 MP4！';
      };
    }

    function generateGif(videoUrl, origWidth, origHeight, duration) {
      statusText.innerText = '正在打包转换为 GIF 文件（请稍候）...';

      const mode = qualitySelect.value;
      let width = origWidth;
      let height = origHeight;
      let fps = 10;

      if (mode === 'medium') {
        width = Math.min(origWidth, 480);
        height = Math.round((width / origWidth) * origHeight);
        fps = 10;
      } else if (mode === 'low') {
        width = Math.min(origWidth, 320);
        height = Math.round((width / origWidth) * origHeight);
        fps = 8;
      } else {
        // 不压缩：适度限制最大宽度以避免浏览器内存溢出（最大 720p）
        if (width > 720) {
          width = 720;
          height = Math.round((width / origWidth) * origHeight);
        }
        fps = 12;
      }

      gifshot.createGIF({
        video: [videoUrl],
        gifWidth: width,
        gifHeight: height,
        interval: 1 / fps,
        numFrames: Math.min(Math.floor(duration * fps), 120), // 最多抽样120帧确保不卡死
        progressCallback: (p) => {
          statusText.innerText = `正在生成 GIF: ${Math.round(p * 100)}%`;
        }
      }, (obj) => {
        if (!obj.error) {
          const gifUrl = obj.image;
          gifPreview.src = gifUrl;
          downloadBtn.href = gifUrl;
          downloadBtn.download = `eira_${Date.now()}.gif`;

          statusText.innerText = 'GIF 生成成功！';
          previewContainer.style.display = 'block';
        } else {
          console.error(obj.error);
          statusText.innerText = '生成失败，请尝试更换短视频或选择“高压缩”模式。';
        }
      });
    }
  </script>
</body>
</html>
