<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>抠图</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important;
      outline: none !important;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      padding: 40px 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      border-bottom: 2px solid #000000;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .sub-title {
      font-size: 11px;
      color: #666666;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    .upload-area {
      border: 1px dashed #000000;
      padding: 32px 16px;
      text-align: center;
      background: #ffffff;
      cursor: pointer;
      margin-bottom: 24px;
    }

    .upload-area:hover, .upload-area:active {
      background-color: #f5f5f5;
    }

    .upload-label {
      font-size: 12px;
      letter-spacing: 1px;
      font-weight: 600;
      cursor: pointer;
      display: block;
    }

    #fileInput {
      display: none;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e0e0e0;
    }

    .status-count {
      font-size: 11px;
      letter-spacing: 1px;
      color: #666666;
    }

    .btn {
      background: #000000;
      color: #ffffff;
      border: 1px solid #000000;
      padding: 8px 16px;
      font-size: 11px;
      letter-spacing: 1px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn:hover, .btn:active {
      background: #333333;
      border-color: #333333;
    }

    .btn:disabled {
      background: #e0e0e0;
      border-color: #e0e0e0;
      color: #999999;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #ffffff;
      color: #000000;
      border-color: #000000;
    }

    .btn-secondary:hover, .btn-secondary:active {
      background: #eeeeee;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    .card {
      border: 1px solid #000000;
      padding: 10px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
    }

    .preview-box {
      width: 100%;
      height: 180px;
      background-color: #fafafa;
      background-image: linear-gradient(45deg, #eee 25%, transparent 25%),
                        linear-gradient(-45deg, #eee 25%, transparent 25%),
                        linear-gradient(45deg, transparent 75%, #eee 75%),
                        linear-gradient(-45deg, transparent 75%, #eee 75%);
      background-size: 12px 12px;
      background-position: 0 0, 0 6px, 6px -6px, -6px 0px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .preview-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .state-text {
      font-size: 11px;
      letter-spacing: 1px;
      color: #666666;
    }

    .file-name {
      font-size: 11px;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #000000;
    }

    .card-actions {
      margin-top: auto;
    }

    .card-actions .btn {
      width: 100%;
      padding: 6px 0;
      text-align: center;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      color: #999999;
      font-size: 11px;
      letter-spacing: 1px;
      padding: 40px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>Eira抠图</h1>
    <div class="sub-title">
    </div>
  </header>

  <div class="upload-area" id="dropZone">
    <label class="upload-label" for="fileInput">点击选择图片或拖拽图片至此处</label>
    <input type="file" id="fileInput" multiple accept="image/*" />
  </div>

  <div class="controls">
    <div class="status-count" id="counter">图片数量: 0</div>
    <button class="btn" id="downloadAllBtn" disabled>全部下载</button>
  </div>

  <div class="grid" id="grid">
    <div class="empty-state">未选择任何文件</div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const grid = document.getElementById('grid');
    const counter = document.getElementById('counter');
    const downloadAllBtn = document.getElementById('downloadAllBtn');

    let processedItems = [];

    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.style.backgroundColor = '#eeeeee';
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.style.backgroundColor = '#ffffff';
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.style.backgroundColor = '#ffffff';
      if (e.dataTransfer.files.length) {
        handleFiles(e.dataTransfer.files);
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) {
        handleFiles(e.target.files);
      }
    });

    function handleFiles(files) {
      const validFiles = Array.from(files).filter(file => file.type.startsWith('image/'));
      if (!validFiles.length) return;

      if (grid.querySelector('.empty-state')) {
        grid.innerHTML = '';
      }

      validFiles.forEach(file => {
        const id = 'item_' + Math.random().toString(36).substr(2, 9);
        const item = {
          id,
          file,
          outputBlob: null,
          fileName: file.name.replace(/\.[^/.]+$/, "") + "_抠图.png"
        };
        processedItems.push(item);
        createCard(item);
        processImage(item);
      });

      updateCounter();
    }

    function createCard(item) {
      const card = document.createElement('div');
      card.className = 'card';
      card.id = item.id;

      card.innerHTML = `
        <div class="preview-box">
          <span class="state-text" id="status_${item.id}">抠图中...</span>
        </div>
        <div class="file-name" title="${item.file.name}">${item.file.name}</div>
        <div class="card-actions">
          <button class="btn btn-secondary" disabled id="dl_${item.id}">下载</button>
        </div>
      `;

      grid.appendChild(card);
    }

    function processImage(item) {
      const btnEl = document.getElementById(`dl_${item.id}`);
      const cardEl = document.getElementById(item.id);

      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;

        // 获取四个角的背景参考色
        const bgR = data[0], bgG = data[1], bgB = data[2];

        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i+1], b = data[i+2];
          // 色差检测扣除背景
          const diff = Math.abs(r - bgR) + Math.abs(g - bgG) + Math.abs(b - bgB);
          if (diff < 60) {
            data[i + 3] = 0; // 设为透明
          }
        }

        ctx.putImageData(imgData, 0, 0);

        canvas.toBlob((blob) => {
          item.outputBlob = blob;
          const url = URL.createObjectURL(blob);
          const previewBox = cardEl.querySelector('.preview-box');
          previewBox.innerHTML = `<img src="${url}" alt="预览" />`;

          btnEl.disabled = false;
          btnEl.onclick = () => triggerDownload(blob, item.fileName);

          checkAllCompleted();
        }, 'image/png');
      };

      img.src = URL.createObjectURL(item.file);
    }

    function triggerDownload(blob, filename) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    function checkAllCompleted() {
      const allReady = processedItems.length > 0 && processedItems.every(i => i.outputBlob !== null);
      if (allReady) {
        downloadAllBtn.disabled = false;
      }
    }

    downloadAllBtn.addEventListener('click', () => {
      processedItems.forEach((item, index) => {
        if (item.outputBlob) {
          setTimeout(() => {
            triggerDownload(item.outputBlob, item.fileName);
          }, index * 250);
        }
      });
    });

    function updateCounter() {
      counter.innerText = `图片数量: ${processedItems.length}`;
    }
  </script>
</body>
</html>
